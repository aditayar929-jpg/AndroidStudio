name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose the compilation type (assembleDebug or assembleRelease)'
        required: true
        default: 'assemble'
        type: choice
        options:
          - assemble
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install basic system dependency packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      - name: Configure JDK 21 (Zulu 21.0.9)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configuring a Gradle 8.13 environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: Verify Bun
        run: |
          which bun
          bun --version

      - name: Install web-ui dependencies with Bun
        working-directory: core/chatai/web-ui
        run: |
          bun install --frozen-lockfile

      - name: Setup Android SDK, NDK 27.1 and CMake 3.22.1
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.1.12297006 cmake;3.22.1'

      - name: Initialize local.properties with SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install higher CMake version (3.31.1) via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties
          
          cmake --version
          protoc --version
          python3 --version

      - name: Grant execution permissions to the Gradle wrapper
        run: chmod +x ./gradlew

      # 🔧 FINAL FIX: Init script with proper import to avoid property resolution error
      - name: Create Gradle init script for compatibility fixes
        run: |
          cat > force-build.gradle << 'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              afterEvaluate {
                  // Force Java 17 source & target compatibility
                  plugins.withId('java') {
                      java {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
                  // Force JavaCompile tasks to use release 17
                  tasks.withType(JavaCompile).configureEach {
                      options.release = 17
                  }
                  // Force Kotlin JVM target to 17 via tasks
                  plugins.withId('org.jetbrains.kotlin.jvm') {
                      tasks.withType(KotlinCompile).configureEach {
                          kotlinOptions {
                              jvmTarget = '17'
                          }
                      }
                  }
                  // Fix bad group ID for gradle-tooling-api
                  configurations.all {
                      resolutionStrategy.dependencySubstitution {
                          substitute module('android.zero.studio.gradle:gradle-tooling-api') with module('org.gradle:gradle-tooling-api:9.5.1')
                      }
                  }
              }
          }
          EOF

      - name: Compile APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          gradle ${{ github.event.inputs.build_type }} --build-cache --max-workers=2 --init-script force-build.gradle

      - name: Upload app-arm64-v8a-release.apk
        if: github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-release.apk
        if: github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: core/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Upload app-x86_64-release.apk
        if: github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: core/app/build/outputs/apk/release/app-x86_64-release.apk
          compression-level: 0

      - name: Upload app-arm64-v8a-debug.apk
        if: github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug.apk
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-debug.apk
        if: github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug.apk
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          compression-level: 0

      - name: Upload app-x86_64-debug.apk
        if: github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug.apk
          path: core/app/build/outputs/apk/debug/app-x86_64-debug.apk
          compression-level: 0
